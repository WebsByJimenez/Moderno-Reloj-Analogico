<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Un reloj analógico minimalista que combina precisión matemática con un diseño visual moderno y refinado." />
    <title>Reloj Analógico Elegante</title>
    <link rel="stylesheet" href="./cs/estilo.css" />
    <link rel="icon" href="./img/reloj.png" type="image/png" />
  </head>
  <body>
    <main class="reloj-contenedor">
      <div class="reloj">
        <div class="numeros">
          <div style="--i: 1"><b>1</b></div>
          <div style="--i: 2"><b>2</b></div>
          <div style="--i: 3"><b>3</b></div>
          <div style="--i: 4"><b>4</b></div>
          <div style="--i: 5"><b>5</b></div>
          <div style="--i: 6"><b>6</b></div>
          <div style="--i: 7"><b>7</b></div>
          <div style="--i: 8"><b>8</b></div>
          <div style="--i: 9"><b>9</b></div>
          <div style="--i: 10"><b>10</b></div>
          <div style="--i: 11"><b>11</b></div>
          <div style="--i: 12"><b>12</b></div>
        </div>

        <div class="manecillas" aria-hidden="true">
          <div class="horas"></div>
          <div class="minutos"></div>
          <div class="segundos"></div>
        </div>

        <img src="./img/Logo_da_Rolex.png" alt="Logo de Rolex" class="reloj-logo" />
      </div>
    </main>

    <script src="./js/index.js" defer></script>
  </body>
</html>
